spring.application.name=FamilyHub

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/familyhub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/FamilyHub}
spring.data.mongodb.auto-index-creation=true


# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
app.jwt.secret=change-me-in-prod-when-deploying-and-probably-move-somewhere-else
app.jwt.ttl-seconds=3600
app.jwt.refresh-ttl-seconds=2592000
app.jwt.cookie-access-name=access_token
app.jwt.cookie-refresh-name=refresh_token
app.jwt.cookie-refresh-path=/
app.jwt.cookie-secure=true
app.jwt.cookie-same-site=Lax

# Family join code configuration
app.family.join-code-ttl-seconds=900

# CORS configuration
app.cors.allowed-origins=https://happywifehappylife.app,https://www.happywifehappylife.app,http://localhost:3000,http://localhost:5173,http://localhost:4200

# Logging
logging.level.root=WARN
logging.level.com.visnevschi.familyhub=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{correlationId:-}] %c{1.} - %m%n


# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${SPRING_MAIL_FROM:}
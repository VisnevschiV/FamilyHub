spring.application.name=FamilyHub

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/familyhub_db
spring.datasource.username=postgres
spring.datasource.password=admin

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
# Show SQL queries in the console (useful for debugging)
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# --- Security (dev only) ---
spring.security.user.name=dev
spring.security.user.password=devpass
spring.security.user.roles=USER

